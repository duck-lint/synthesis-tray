tracker:
  kind: github
  provider:
    repo: "duck-lint/synthesis-tray"
    token: $SYMPHONY_GITHUB_TOKEN
  required_labels:
    - symphony:auto
  active_states:
    - open
  terminal_states:
    - closed

polling:
  interval_ms: 5000

workspace:
  root: ~/code/symphony-workspaces/synthesis-tray
  repository: github.com/duck-lint/synthesis-tray
  branch: master

human_response:
  authorized_user_ids:
    - 250741170

lifecycle:
  integrity_secret: "$SYMPHONY_LIFECYCLE_INTEGRITY_SECRET"

environment:
  capabilities:
    - id: synthesis-tray-node
      command:
        executable: node
        args:
          - -e
          - "if (process.platform !== 'linux' || Number(process.versions.node.split('.')[0]) !== 22) process.exit(1)"

    - id: synthesis-tray-dependencies
      command:
        executable: node
        args:
          - -e
          - |
            const fs = require('node:fs');
            for (const name of ['typescript', 'vitest', 'esbuild', 'obsidian', 'sql.js']) {
              if (!fs.existsSync(`node_modules/${name}/package.json`)) {
                throw new Error(`Missing dependency: ${name}`);
              }
            }

hooks:
  timeout_ms: 180000

  after_create: |
    set -eu

    echo "=== Node environment ==="

    command -v node
    command -v npm

    node -p '"Platform: " + process.platform'
    node -p '"Version: " + process.version'
    node -p '"Executable: " + process.execPath'

    platform="$(node -p 'process.platform')"
    major="$(node -p 'process.versions.node.split(".")[0]')"

    if [ "$platform" != linux ]; then
      echo "ERROR: Linux Node required; found $platform" >&2
      exit 1
    fi

    if [ "$major" != 22 ]; then
      echo "ERROR: Node 22 required; found Node $major" >&2
      exit 1
    fi

    case "$(command -v npm)" in
      /mnt/*|*.cmd|*.exe)
        echo "ERROR: Windows npm detected" >&2
        exit 1
        ;;
    esac

    echo "Node environment verified."

    git clone --depth 1 --single-branch \
      --branch master \
      https://github.com/duck-lint/synthesis-tray.git .

    mkdir -p .symphony-substrate/obsidian-1.13.7

    cp -a \
      "$HOME/.local/share/obsidian/obsidian-1.13.7.asar/." \
      .symphony-substrate/obsidian-1.13.7/

    npm ci

environment:
  capabilities:
    - id: obsidian-1.13.7-runtime-source
      resources:
        - .symphony-substrate/obsidian-1.13.7

agent:
  max_concurrent_agents: 1

codex:
  command: codex --config 'model="gpt-5.6-luna"' --config 'model_reasoning_effort="high"' app-server
  approval_policy: on-request
  thread_sandbox: workspace-write
  turn_sandbox_policy:
    type: workspaceWrite
    networkAccess: false
